name: CI Pipeline - Branche Dev

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: intranet-newdeal
  IMAGE_TAG: 1.0.0
  DOCKER_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ===============================
  # JOB 1 - BUILD IMAGE DOCKER
  # ===============================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build de l'image Docker
        run: |
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Vérification de l'image
        run: |
          docker image ls | grep ${{ env.IMAGE_NAME }}

      - name: Sauvegarde de l'image pour les jobs suivants
        run: |
          docker save ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o image.tar

      - name: Upload de l'image comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  # ===============================
  # JOB 2 - SCAN SECURITE
  # ===============================
  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Download de l'image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Chargement de l'image Docker
        run: |
          docker load -i image.tar

      - name: Scan des vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Scan des secrets avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table

  # ===============================
  # JOB 3 - PUSH VERS DOCKER HUB
  # ===============================
  push:
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Download de l'image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Chargement de l'image Docker
        run: |
          docker load -i image.tar

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push de l'image vers Docker Hub
        run: |
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  # ===============================
  # NOTIFICATION EMAIL
  # ===============================
  notification:
    runs-on: ubuntu-latest
    needs: [build, scan, push]
    if: always()
    steps:
      - name: Notification email succès
        if: ${{ needs.build.result == 'success' && needs.scan.result == 'success' && needs.push.result == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ CI Pipeline SUCCÈS - Intranet NewDeal"
          body: "Le pipeline CI sur la branche dev a été exécuté avec succès."
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}

      - name: Notification email échec
        if: ${{ needs.build.result == 'failure' || needs.scan.result == 'failure' || needs.push.result == 'failure' }}
        uses: dawidd6/action-send-mail@v3
        with