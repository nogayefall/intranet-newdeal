name: CI Pipeline - Branche Dev

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: intranet-newdeal
  IMAGE_TAG: 1.0.0
  DOCKER_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ===============================
  # JOB 1 - BUILD IMAGE DOCKER
  # ===============================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build de l'image Docker
        run: |
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Vérification de l'image
        run: |
          docker image ls | grep ${{ env.IMAGE_NAME }}

      - name: Sauvegarde de l'image pour les jobs suivants
        run: |
          docker save ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o image.tar

      - name: Upload de l'image comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  # ===============================
  # JOB 2 - SCAN SECURITE
  # ===============================
  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Download de l'image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Chargement de l'image Docker
        run: |
          docker load -i image.tar

      - name: Scan des vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 0
          severity: LOW,MEDIUM,HIGH,CRITICAL

      - name: Scan des secrets avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table

  # ===============================
  # JOB 3 - PUSH VERS DOCKER HUB
  # ===============================
  push:
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Download de l'image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Chargement de l'image Docker
        run: |
          docker load -i image.tar

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push de l'image vers Docker Hub
        run: |
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}