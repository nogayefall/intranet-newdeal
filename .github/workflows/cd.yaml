name: CD Pipeline - Branche Prod

on:
  push:
    branches:
      - prod

env:
  IMAGE_NAME: intranet-newdeal
  IMAGE_TAG: 1.0.0
  DOCKER_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ===============================
  # JOB 1 - SCAN SECURITE
  # ===============================
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull de l'image depuis Docker Hub
        run: |
          docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Scan des vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 0
          severity: LOW,MEDIUM,HIGH,CRITICAL

  # ===============================
  # JOB 2 - DEPLOIEMENT SUR runner_prod
  # ===============================
  deploy:
    runs-on: runner_prod
    needs: scan
    steps:
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | `
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull de l'image depuis Docker Hub
        run: |
          docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Arrêter le conteneur existant
        run: |
          docker stop intranet-prod 2>$null; exit 0

      - name: Supprimer l'ancien conteneur
        run: |
          docker rm intranet-prod 2>$null; exit 0

      - name: Déployer le nouveau conteneur
        run: |
          docker run -d `
            -p 80:80 `
            --name intranet-prod `
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Vérifier le déploiement
        run: |
          docker ps | findstr intranet-prod